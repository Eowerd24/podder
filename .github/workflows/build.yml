name: Build Linux Native Binary

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

# Build/test jobs only need to read the repository. contents: write is
# granted only to the release-publishing job, and only for a tag push.
permissions:
  contents: read

env:
  # Keep the Wails v3 CLI pinned to the exact same version as the library
  # dependency in go.mod, instead of `wails3@latest` — installing a
  # different CLI version than the library it drives is how generated
  # bindings/build config can silently drift out of sync with the code.
  WAILS_VERSION: v3.0.0-alpha2.117

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
          go-version: '1.25'
          cache: true

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config

    - name: go vet
      run: go vet ./...

    - name: go test
      run: go test ./...

    - name: go test -race
      # Race detector on the pure Go application/test code (the build/ios
      # and build/android helper packages are platform-scaffolding, not
      # part of the tested application).
      run: go test -race .

    - name: Install Frontend NPM Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build

    - name: Install Wails v3 CLI
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

    - name: Build Application Binary
      run: |
        export PATH="$PATH:$(go env GOPATH)/bin"
        wails3 build

    - name: Upload Linux Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: podder-linux-amd64
        path: bin/podder

  release:
    name: Publish Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Download Linux Binary Artifact
      uses: actions/download-artifact@v4
      with:
        name: podder-linux-amd64
        path: bin

    - name: Make Binary Executable
      run: chmod +x bin/podder

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: bin/podder
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
